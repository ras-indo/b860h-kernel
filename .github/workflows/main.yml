name: Build Kernel + Modules + DTB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            gcc-aarch64-linux-gnu \
            make \
            zip

      - name: Compile kernel + modules + dtbs
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image dtbs

      - name: Install modules
        run: |
          mkdir -p out_mod
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- INSTALL_MOD_PATH=out_mod modules_install

      - name: Package output
        run: |
          mkdir output
          cp arch/arm64/boot/Image output/
          cp arch/arm64/boot/dts/amlogic/*.dtb output/
          cp -r out_mod/lib/modules output/
          zip -r kernel-build-full.zip output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-full-build
          path: kernel-build-full.zip
